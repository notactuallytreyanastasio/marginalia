<title>Loose Leaf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Loose Leaf. One fixed look: a comic-inked toy on squared paper. A full-screen
   canvas with a thin layer of DOM over it; no light/dark variants by design. */
:root {
  --paper: #fbfaf7;
  --ink: #1c1a17;
  --dim: #6b665e;
  --sky: #f6dcc0;
  --go: #ee4d3d;
  --go-hover: #f25e4f;
  --go-text: #fffaf0;
  --gem: #ffc72e;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--sky); color: var(--ink); overflow: hidden; }
*, *::before, *::after { box-sizing: border-box; }

/* ===========================================================================
   Loose Leaf — the marble game at /play
   ---------------------------------------------------------------------------
   A canvas that fills the screen and a thin layer of DOM over it. The hook
   sets data-phase on the stage (title, ready, playing, goal, cleared,
   fallout, timeup, unsupported) and everything here keys off that, so the
   script never touches a style except to move the stick.
   =========================================================================== */
.ll-stage {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: var(--sky);
  color: var(--ink);
  font-family: var(--sans);
  /* the page must not scroll, zoom or select under a dragging thumb */
  touch-action: none;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.ll-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.ll-hud {
  position: absolute;
  top: calc(10px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  align-items: center;
  gap: 0.4rem;
  pointer-events: none;
}
.ll-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  min-height: 2.25rem;
  padding: 0 0.7rem;
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: 999px;
  box-shadow: 0 3px 0 var(--ink);
  font-size: 0.82rem;
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
  pointer-events: auto;
}
.ll-level { min-width: 0; overflow: hidden; text-overflow: ellipsis; display: block; line-height: 2rem; }
.ll-time { margin-left: auto; min-width: 4.1rem; justify-content: center; font-variant-numeric: tabular-nums; }

.ll-mute { width: 2.25rem; padding: 0; justify-content: center; cursor: pointer; transition: transform 0.12s ease, box-shadow 0.12s ease; }
.ll-mute:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.ll-gem { width: 0.7rem; height: 0.7rem; background: var(--gem); border: 2px solid var(--ink); transform: rotate(45deg); }
.ll-mute { font-size: 1.05rem; color: var(--ink); }
.ll-mute[aria-pressed="true"] { text-decoration: line-through; opacity: 0.6; }
.ll-stage[data-phase="title"] :is(.ll-level, .ll-gems, .ll-time),
.ll-stage[data-phase="unsupported"] :is(.ll-level, .ll-gems, .ll-time, .ll-mute) { visibility: hidden; }

.ll-banner {
  position: absolute;
  top: 22%;
  left: 0;
  right: 0;
  margin: 0;
  padding: 0 1rem;
  text-align: center;
  font-family: var(--serif);
  font-size: clamp(1.5rem, 7vw, 2.6rem);
  font-weight: 700;
  font-style: italic;
  color: var(--paper);
  /* an inked outline, to match the picture behind it */
  text-shadow:
    -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink),
    2px 2px 0 var(--ink), 0 4px 0 var(--ink);
  pointer-events: none;
}
.ll-banner:empty { display: none; }
.ll-stage[data-phase="ready"] .ll-banner,
.ll-stage[data-phase="goal"] .ll-banner,
.ll-stage[data-phase="fallout"] .ll-banner,
.ll-stage[data-phase="timeup"] .ll-banner { animation: ll-pop 0.35s cubic-bezier(0.2, 1.4, 0.4, 1) both; }

.ll-card {
  position: absolute;
  left: 50%;
  bottom: max(12%, calc(env(safe-area-inset-bottom) + 2rem));
  width: min(22rem, calc(100% - 2rem));
  margin: 0;
  padding: 1.3rem 1.3rem 1.4rem;
  transform: translateX(-50%);
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: 14px;
  box-shadow: 0 6px 0 var(--ink);
  text-align: center;
  display: none;
}
.ll-stage[data-phase="title"] .ll-card:not(.ll-unsupported),
.ll-stage[data-phase="cleared"] .ll-card:not(.ll-unsupported),
.ll-stage[data-phase="unsupported"] .ll-unsupported { display: block; animation: ll-rise 0.3s ease-out both; }
.ll-card h1 { margin: 0 0 0.35rem; font-family: var(--serif); font-size: 1.7rem; font-style: italic; line-height: 1.15; }
.ll-card p { margin: 0 0 1rem; font-size: 0.92rem; line-height: 1.45; color: var(--dim); }
.ll-unsupported { font-size: 0.95rem; line-height: 1.45; }
.ll-button {
  width: 100%;
  min-height: 3rem;
  background: var(--go);
  color: var(--go-text);
  border: 2px solid var(--ink);
  border-radius: 999px;
  box-shadow: 0 4px 0 var(--ink);
  font-size: 1.05rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
}
.ll-button:hover { background: var(--go-hover); }
.ll-button:active { transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }

/* The stick appears under the thumb, wherever that lands. */
.ll-stick {
  position: absolute;
  top: 0;
  left: 0;
  width: 0;
  height: 0;
  opacity: 0;
  transition: opacity 0.15s ease;
  pointer-events: none;
}
.ll-stick[data-active] { opacity: 1; }
.ll-stick::before, .ll-stick span { content: ""; position: absolute; border-radius: 50%; border: 2px solid var(--ink); }
.ll-stick::before { inset: -64px; width: 128px; height: 128px; background: rgb(251 250 247 / 0.28); }
.ll-stick span { top: -22px; left: -22px; width: 44px; height: 44px; background: rgb(251 250 247 / 0.9); box-shadow: 0 3px 0 var(--ink); }

@keyframes ll-pop { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
@keyframes ll-rise { from { opacity: 0; translate: 0 12px; } to { opacity: 1; translate: 0 0; } }
@media (prefers-reduced-motion: reduce) {
  .ll-banner, .ll-card { animation: none !important; }
}
</style>
<div id="loose-leaf" class="ll-stage" data-phase="title">
  <canvas id="loose-leaf-canvas" class="ll-canvas" data-ll="canvas"></canvas>

  <header id="loose-leaf-hud" class="ll-hud">
    <span class="ll-chip ll-level" data-ll="level">1 · First Page</span>
    <span class="ll-chip ll-gems"><span class="ll-gem" aria-hidden="true"></span><span data-ll="gems">0/0</span></span>
    <span class="ll-chip ll-time" data-ll="time">60.0</span>
    <button id="loose-leaf-mute" type="button" class="ll-chip ll-mute" data-ll="mute" aria-label="Mute sound" aria-pressed="false">♪</button>
  </header>

  <p id="loose-leaf-banner" class="ll-banner" data-ll="banner" aria-live="polite"></p>

  <section id="loose-leaf-card" class="ll-card">
    <h1 data-ll="card-title">Loose Leaf</h1>
    <p data-ll="card-body">Roll the marble to the ring before the clock runs out. Drag anywhere to tilt the page.</p>
    <button id="loose-leaf-action" type="button" class="ll-button" data-ll="action">Play</button>
  </section>

  <p id="loose-leaf-unsupported" class="ll-card ll-unsupported">This needs WebGL, and this browser will not give it one.</p>

  <div class="ll-stick" data-ll="stick" aria-hidden="true"><span></span></div>
</div>
